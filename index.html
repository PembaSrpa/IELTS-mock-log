<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Mock Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E5E5E5;--card:#fff;--ink:#262626;--mute:#404040;--line:#D4D4D4;--track:#D4D4D4;--fill:#262626;--soft:#F3F3F3;--hl:#fff;
--glass:rgba(255,255,255,.5);--gb:rgba(255,255,255,.75);--gs:rgba(38,38,38,.12);--pbg:rgba(38,38,38,.84);--pfg:#fff;--glow1:#fff;--glow2:#D4D4D4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#262626;--ink:#E5E5E5;--mute:#D4D4D4;--line:#404040;--track:#404040;--fill:#fff;--soft:#303030;--hl:rgba(255,255,255,.22);--glass:rgba(64,64,64,.45);--gb:rgba(255,255,255,.18);--gs:rgba(0,0,0,.5);--pbg:rgba(229,229,229,.88);--pfg:#262626;--glow1:#404040;--glow2:#262626}}
:root[data-theme="dark"]{--bg:#000;--card:#262626;--ink:#E5E5E5;--mute:#D4D4D4;--line:#404040;--track:#404040;--fill:#fff;--soft:#303030;--hl:rgba(255,255,255,.22);--glass:rgba(64,64,64,.45);--gb:rgba(255,255,255,.18);--gs:rgba(0,0,0,.5);--pbg:rgba(229,229,229,.88);--pfg:#262626;--glow1:#404040;--glow2:#262626}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;background:radial-gradient(700px 420px at 8% -5%,var(--glow1),transparent 70%),radial-gradient(600px 420px at 100% 25%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:12px 16px 48px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl),0 6px 22px var(--gs)}
nav{position:sticky;top:10px;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 20px;border-radius:22px;margin-bottom:18px}
h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
button{font:inherit;color:var(--ink);cursor:pointer;border-radius:999px;padding:9px 20px;font-weight:600;transition:transform .12s}
button:active{transform:scale(.97)}
button.gl{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl),0 3px 10px var(--gs)}
button.p{background:var(--pbg);color:var(--pfg);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl),0 4px 14px var(--gs)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
h2{font-size:17px;font-weight:800;margin-bottom:12px}
.hero{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-bottom:16px}
.gauge{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge svg{width:100%;max-width:240px}
.gauge .big{font-size:56px;font-weight:800;line-height:1;margin-top:-60px;letter-spacing:-.03em}
.gauge .cap{color:var(--mute);margin-top:8px;font-size:13px}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px}
.sec .n{font-weight:600;color:var(--mute);font-size:13px}
.sec .big{font-size:34px;font-weight:800}
.sec .m{font-size:12.5px;color:var(--mute)}
.bar{height:6px;border-radius:4px;background:var(--track);margin:8px 0}
.bar i{display:block;height:100%;border-radius:4px;background:var(--fill)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;font-size:12.5px;color:var(--mute);gap:4px;font-weight:500}
input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{padding:5px 12px;border-radius:999px;background:var(--soft);font-size:13px;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:auto}
.chart text{fill:var(--mute);font-size:10px;font-family:Figtree,sans-serif}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.row{cursor:pointer}tr.row:hover td,tr.sel td{background:var(--soft)}
button.x{padding:0;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl)}
th .sm{display:none}
th:last-child,td:last-child{width:48px}
td{vertical-align:middle}
label.f{justify-content:flex-end}
.err{color:var(--ink);font-size:13px;margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.err[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:320px;border-radius:28px;padding:24px 20px 20px;text-align:center;background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent)}
.sheet h3{font:800 19px "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 6px}
.sheet p{margin:0 0 18px;color:var(--mute);font-size:14px}
.sheet .btns{flex-wrap:nowrap}.sheet button{flex:1;padding:11px 8px}
.empty{color:var(--mute);padding:18px;text-align:center}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}}
@media(max-width:520px){table{table-layout:fixed}th,td{padding:9px 2px;font-size:13px}th{font-size:11px}th .lg{display:none}th .sm{display:inline}th:first-child,td:first-child{width:34px}th:last-child,td:last-child{width:42px}}
@media(max-width:440px){.secs{grid-template-columns:1fr 1fr}.sec .big{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<nav class="glass"><h1>IELTS mock log</h1><button class="gl" id="new">New log</button></nav>

<section class="hero">
  <div class="card gauge">
    <svg viewBox="0 0 220 125" aria-hidden="true"><path id="gt" fill="none" stroke="var(--track)" stroke-width="16" stroke-linecap="round"/><path id="gv" fill="none" stroke="var(--fill)" stroke-width="16" stroke-linecap="round"/></svg>
    <div class="big" id="ov">–</div>
    <div class="cap">Overall band, latest test</div>
  </div>
  <div class="secs" id="secs"></div>
</section>

<section class="two">
  <div class="card" id="formcard">
    <h2 id="ftitle">Log 1</h2>
    <div class="form">
      <label class="f">Listening correct answers (0–40)<input id="lr" type="number" inputmode="numeric" min="0" max="40" step="1"></label>
      <label class="f">Reading correct answers (0–40)<input id="rr" type="number" inputmode="numeric" min="0" max="40" step="1"></label>
      <label class="f">Writing Task 1 band<input id="w1" type="number" inputmode="decimal" min="0" max="9" step="0.5"></label>
      <label class="f">Writing Task 2 band<input id="w2" type="number" inputmode="decimal" min="0" max="9" step="0.5"></label>
      <label class="f">Speaking band<input id="sp" type="number" inputmode="decimal" min="0" max="9" step="0.5"></label>
    </div>
    <div class="prev" id="prev"></div>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="btns"><button class="p" id="save">Save log</button><button class="gl" id="del" hidden>Delete log</button></div>
  </div>
  <div class="card">
    <h2>Band trend</h2>
    <svg class="chart" id="chart" viewBox="0 0 520 280"></svg>
    <div class="legend" id="leg"></div>
  </div>
</section>

<section class="card">
  <h2>Test history</h2>
  <table><thead><tr><th><span class="lg">Test no.</span><span class="sm">#</span></th><th><span class="lg">Listening</span><span class="sm">Lis.</span></th><th><span class="lg">Reading</span><span class="sm">Read.</span></th><th><span class="lg">Writing</span><span class="sm">Writ.</span></th><th><span class="lg">Speaking</span><span class="sm">Speak.</span></th><th>Overall</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</section>
</div>
<div class="ov" id="ov2" hidden><div class="sheet glass" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt">Delete log?</h3><p>This can't be undone.</p><div class="btns"><button class="gl" id="dno">Cancel</button><button class="p" id="dyes">Delete</button></div></div></div>

<script>
const AR=[[0,2],[4,2.5],[6,3],[8,3.5],[10,4],[13,4.5],[15,5],[19,5.5],[23,6],[27,6.5],[30,7],[33,7.5],[35,8],[37,8.5],[39,9]];
const LT=[[0,2],[4,2.5],[6,3],[8,3.5],[10,4],[13,4.5],[16,5],[18,5.5],[23,6],[26,6.5],[30,7],[32,7.5],[35,8],[37,8.5],[39,9]];
const KEY="ielts-mock-tracker-v2",$=id=>document.getElementById(id);
let logs=[];
try{
  const r=localStorage.getItem(KEY);
  if(r)logs=JSON.parse(r);
  else{const o=JSON.parse(localStorage.getItem("ielts-mock-tracker-v1")||"null");
    if(o&&o.e)logs=Object.keys(o.e).map(Number).sort((a,b)=>a-b).map(k=>{const e=o.e[k];return{lr:e.lr,rr:e.rr,w1:e.w1,w2:e.w2,sp:e.sp}})}
}catch(_){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(logs))}catch(_){}};
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;
const band=(t,v)=>{if(v==null)return null;let b=null;for(const[m,x]of t)if(v>=m)b=x;return b};
const showErr=m=>{$("err").textContent=m||"";$("err").hidden=!m};
const f1=v=>v==null?"–":v.toFixed(1);
function calc(e){
  const L=band(LT,e.lr),R=band(AR,e.rr);
  const W=(e.w1!=null&&e.w2!=null)?Math.round((e.w1+2*e.w2)/3*2)/2:null,S=e.sp;
  const O=[L,R,W,S].every(x=>x!=null)?Math.round((L+R+W+S)/4*2)/2:null;
  return{L,R,W,S,O};
}
const SEC=[["L","Listening"],["R","Reading"],["W","Writing"],["S","Speaking"]];
const F=["lr","rr","w1","w2","sp"];
let cur=null;

function gauge(O){
  $("gt").setAttribute("d","M20,110 A90,90 0 0 1 200,110");
  if(O>0){const a=Math.PI-(Math.min(9,O)/9)*Math.PI;$("gv").setAttribute("d",`M20,110 A90,90 0 0 1 ${110+90*Math.cos(a)},${110-90*Math.sin(a)}`)}
  else $("gv").setAttribute("d","");
  $("ov").textContent=f1(O);
}
function render(){
  const rows=logs.map((e,i)=>({i,c:calc(e)}));
  const full=rows.filter(r=>r.c.O!=null);
  gauge(full.length?full[full.length-1].c.O:null);
  $("secs").innerHTML=SEC.map(([k,n])=>{
    const v=rows.map(r=>r.c[k]).filter(x=>x!=null),lat=v.length?v[v.length-1]:null;
    const avg=v.length?v.reduce((a,b)=>a+b,0)/v.length:null,best=v.length?Math.max(...v):null;
    return`<div class="sec"><div class="n">${n}</div><div class="big">${f1(lat)}</div><div class="bar"><i style="width:${(lat||0)/9*100}%"></i></div><div class="m">Avg ${f1(avg)} · Best ${f1(best)}</div></div>`}).join("");
  $("rows").innerHTML=rows.length?rows.map(r=>`<tr class="row${r.i===cur?" sel":""}" data-i="${r.i}"><td>${r.i+1}</td><td>${f1(r.c.L)}</td><td>${f1(r.c.R)}</td><td>${f1(r.c.W)}</td><td>${f1(r.c.S)}</td><td><b>${f1(r.c.O)}</b></td><td><button class="x" data-del="${r.i}" aria-label="Delete log ${r.i+1}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">No logs yet.</td></tr>`;
  $("rows").querySelectorAll(".row").forEach(t=>t.onclick=ev=>{if(ev.target.closest(".x"))return;cur=+t.dataset.i;loadForm();render();$("formcard").scrollIntoView({behavior:"smooth",block:"center"})});
  $("rows").querySelectorAll(".x").forEach(b=>b.onclick=()=>askDelete(+b.dataset.del));
  chart(rows);preview();
}
const SER=[["L","Listening","var(--mute)","",1.8],["R","Reading","var(--mute)","5 3",1.8],["W","Writing","var(--ink)","2 3",2],["S","Speaking","var(--ink)","8 3 2 3",1.8],["O","Overall","var(--ink)","",3.4]];
function chart(rows){
  const W=520,H=280,l=28,r=14,t=10,b=24,n=rows.length;
  const x=i=>l+(n<=1?.5:i/(n-1))*(W-l-r),y=v=>t+(9-Math.max(3,v))/6*(H-t-b);
  let s="";
  for(let v=3;v<=9;v++)s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const step=Math.ceil(n/10)||1;
  for(let i=0;i<n;i+=step)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
  for(const[k,,col,dash,w]of SER){
    const p=rows.filter(q=>q.c[k]!=null).map(q=>[x(q.i),y(q.c[k])]);
    if(!p.length)continue;
    s+=`<path d="${p.map((a,i)=>(i?"L":"M")+a[0].toFixed(1)+","+a[1].toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linejoin="round" stroke-linecap="round"/>`;
    p.forEach(a=>s+=`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${k==="O"?4:2.5}" fill="${col}"/>`);
  }
  $("chart").innerHTML=s;
  $("leg").innerHTML=SER.map(([,n,col,dash,w])=>`<span><svg width="26" height="8"><line x1="1" x2="25" y1="4" y2="4" stroke="${col}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round"/></svg>${n}</span>`).join("");
}
function read(){const e={};F.forEach(k=>e[k]=num($(k).value));return e}
function loadForm(){
  const e=cur==null?{}:logs[cur];F.forEach(k=>$(k).value=e[k]??"");
  $("ftitle").textContent=cur==null?`Log ${logs.length+1}`:`Edit log ${cur+1}`;
  $("del").hidden=cur==null;
}
function preview(){
  const c=calc(read());
  $("prev").innerHTML=SEC.map(([k,n])=>`<span class="chip">${n} <b>${f1(c[k])}</b></span>`).join("")+`<span class="chip">Overall <b>${f1(c.O)}</b></span>`;
}
F.forEach(k=>$(k).addEventListener("input",()=>{showErr("");preview()}));
$("save").onclick=()=>{
  const e=read();
  if(F.every(k=>e[k]==null)){showErr("Enter at least one score first.");return}
  if([e.lr,e.rr].some(v=>v!=null&&(v<0||v>40||!Number.isInteger(v)))){showErr("Listening and Reading need whole numbers of correct answers from 0 to 40 (not bands).");return}
  if([e.w1,e.w2,e.sp].some(v=>v!=null&&(v<0||v>9))){showErr("Bands must be between 0 and 9.");return}
  if(cur==null)logs.push(e);else logs[cur]=e;
  showErr("");persist();cur=null;loadForm();render();
};
let pend=null;
function askDelete(i){pend=i;$("dt").textContent=`Delete log ${i+1}?`;$("ov2").hidden=false;$("dno").focus()}
function closeDlg(){$("ov2").hidden=true;pend=null}
$("dno").onclick=closeDlg;
$("ov2").onclick=e=>{if(e.target===$("ov2"))closeDlg()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg()});
$("dyes").onclick=()=>{if(pend!=null){logs.splice(pend,1);persist();cur=null;loadForm();render()}closeDlg()};
$("del").onclick=()=>askDelete(cur);
$("new").onclick=()=>{cur=null;loadForm();render();$("formcard").scrollIntoView({behavior:"smooth",block:"center"});$("lr").focus({preventScroll:true})};
loadForm();render();
</script>
</body>
</html>
